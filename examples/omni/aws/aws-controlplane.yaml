# Control-plane MachineClass. Uses a broader IAM profile
# (TalosControlPlane) since the CP hosts every AWS-integrating
# controller (VPC-CNI, EBS-CSI, LB Controller, external-dns,
# cluster-autoscaler, CCM). Create that role + instance profile in
# AWS first — see the omni-infra-provider-aws README, section
# "Create the Node IAM Roles".
#
# Templated fields are substituted with envsubst — see README ("Deploy").
metadata:
    namespace: default
    type: MachineClasses.omni.sidero.dev
    id: aws-controlplane
spec:
    matchlabels: []
    autoprovision:
        providerid: ${OMNI_INFRA_PROVIDER_ID}
        kernelargs: []
        metavalues: []
        providerdata: |
            volume_size: 20
            instance_type: t3.medium
            security_group_ids:
              - ${AWS_SECURITY_GROUP_ID}
            arch: amd64
            subnet_ids:
              - ${AWS_SUBNET_ID_1}
              - ${AWS_SUBNET_ID_2}
              - ${AWS_SUBNET_ID_3}
            iam_instance_profile_arn: arn:aws:iam::${AWS_ACCOUNT_ID}:instance-profile/TalosControlPlane
        grpctunnel: 0
